name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (test, check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Build only needs these to exist; no Sanity data is fetched at build time.
      PUBLIC_SANITY_PROJECT_ID: ci-placeholder
      PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  studio:
    name: Studio (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    env:
      SANITY_STUDIO_PROJECT_ID: ci-placeholder
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
