version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      app-dependencies:
        patterns: ["*"]
    ignore:
      # SvelteKit 2.x declares no TypeScript 7 support yet (npm ci fails on the peer range)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /studio
    schedule:
      interval: monthly
    groups:
      studio-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
